<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="droneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="thermalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="350" fill="url(#droneBg)"/>
  
  <!-- Perspective Roof Grid -->
  <polygon points="40,160 560,160 580,330 20,330" fill="#131d31" stroke="#334155" stroke-width="2"/>
  <line x1="140" y1="160" x2="120" y2="330" stroke="#334155" stroke-width="1.5"/>
  <line x1="240" y1="160" x2="220" y2="330" stroke="#334155" stroke-width="1.5"/>
  <line x1="340" y1="160" x2="340" y2="330" stroke="#334155" stroke-width="1.5"/>
  <line x1="440" y1="160" x2="460" y2="330" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Thermal Moisture Scan Hotspot -->
  <ellipse cx="280" cy="240" rx="90" ry="45" fill="url(#thermalGlow)"/>
  <circle cx="280" cy="240" r="4" fill="#ffffff"/>
  <circle cx="280" cy="240" r="28" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Scanning Drone -->
  <g transform="translate(420, 80)">
    <ellipse cx="0" cy="0" rx="35" ry="14" fill="#334155" stroke="#ea580c" stroke-width="2"/>
    <ellipse cx="0" cy="-2" rx="14" ry="7" fill="#0f172a"/>
    <line x1="-35" y1="0" x2="-60" y2="-15" stroke="#94a3b8" stroke-width="3"/>
    <line x1="35" y1="0" x2="60" y2="-15" stroke="#94a3b8" stroke-width="3"/>
    <line x1="-30" y1="4" x2="-50" y2="20" stroke="#94a3b8" stroke-width="3"/>
    <line x1="30" y1="4" x2="50" y2="20" stroke="#94a3b8" stroke-width="3"/>
    <ellipse cx="-60" cy="-15" rx="22" ry="4" fill="#38bdf8" opacity="0.8"/>
    <ellipse cx="60" cy="-15" rx="22" ry="4" fill="#38bdf8" opacity="0.8"/>
    <ellipse cx="-50" cy="20" rx="22" ry="4" fill="#38bdf8" opacity="0.8"/>
    <ellipse cx="50" cy="20" rx="22" ry="4" fill="#38bdf8" opacity="0.8"/>
    <!-- Laser Beam -->
    <polygon points="0,15 -170,160 -110,160" fill="#38bdf8" opacity="0.18"/>
  </g>

  <!-- HUD Tag -->
  <rect x="30" y="25" width="170" height="32" rx="6" fill="#0f172a" stroke="#ea580c" stroke-width="1.5"/>
  <text x="45" y="46" fill="#ea580c" font-size="12" font-family="monospace" font-weight="bold">AI THERMAL SCAN</text>
</svg>
