<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="floodBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="waterPool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#floodBg)"/>

  <!-- Terrace Parapet Pool Basin -->
  <polygon points="40,210 560,210 580,310 20,310" fill="#334155"/>
  <polygon points="40,160 560,160 560,210 40,210" fill="#1e293b"/>
  <!-- Watertight Fillet Seal Line -->
  <line x1="40" y1="210" x2="560" y2="210" stroke="#ea580c" stroke-width="4"/>

  <!-- Standing Ponded Water Layer (Flood Test in Progress) -->
  <polygon points="60,195 540,195 565,280 35,280" fill="url(#waterPool)"/>

  <!-- Water Surface Ripples -->
  <ellipse cx="200" cy="225" rx="60" ry="12" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.6"/>
  <ellipse cx="400" cy="235" rx="70" ry="14" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.6"/>

  <!-- Depth Gauge Ruler Submerged in Water -->
  <g transform="translate(470, 130)">
    <rect x="0" y="0" width="28" height="150" rx="3" fill="#ffffff" stroke="#334155" stroke-width="2"/>
    <line x1="5" y1="30" x2="23" y2="30" stroke="#ea580c" stroke-width="2"/>
    <line x1="5" y1="60" x2="23" y2="60" stroke="#0f172a" stroke-width="2"/>
    <line x1="5" y1="90" x2="23" y2="90" stroke="#0f172a" stroke-width="2"/>
    <line x1="5" y1="120" x2="23" y2="120" stroke="#0f172a" stroke-width="2"/>
    <polygon points="32,75 42,70 42,80" fill="#10b981"/>
  </g>

  <!-- 48-Hour Timer Badge with Green Verification Check -->
  <g transform="translate(180, 85)">
    <circle cx="0" cy="0" r="45" fill="#0f172a" stroke="#10b981" stroke-width="4"/>
    <text x="0" y="-8" fill="#ffffff" font-size="18" font-weight="900" font-family="system-ui" text-anchor="middle">48h</text>
    <text x="0" y="10" fill="#10b981" font-size="9" font-weight="bold" font-family="system-ui" text-anchor="middle">FLOOD TEST</text>
    <circle cx="28" cy="-28" r="16" fill="#10b981"/>
    <path d="M 23,-28 L 27,-24 L 34,-31" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Tag -->
  <rect x="30" y="25" width="220" height="32" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="45" y="46" fill="#10b981" font-size="12" font-family="monospace" font-weight="bold">100% WATERPROOF PASSED</text>
</svg>
