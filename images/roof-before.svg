<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>text, rect[rx="8"], rect[rx="6"] { display: none; }</style>
    <linearGradient id="stormSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shingleDamaged" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <!-- Storm Overcast Sky -->
  <rect width="800" height="500" fill="url(#stormSky)"/>

  <!-- House Roof Pitch Structure -->
  <polygon points="400,60 50,380 750,380" fill="url(#shingleDamaged)"/>

  <!-- Shingle Rows (Irregular and Broken) -->
  <line x1="120" y1="320" x2="680" y2="320" stroke="#18181b" stroke-width="6"/>
  <line x1="180" y1="260" x2="620" y2="260" stroke="#18181b" stroke-width="6"/>
  <line x1="240" y1="200" x2="560" y2="200" stroke="#18181b" stroke-width="6"/>
  <line x1="310" y1="140" x2="490" y2="140" stroke="#18181b" stroke-width="6"/>

  <!-- Missing & Blown-off Shingles Showing Exposed Deck / Tar Paper -->
  <polygon points="340,240 440,220 460,300 320,310" fill="#78350f" stroke="#451a03" stroke-width="3"/>
  <text x="350" y="275" fill="#fde047" font-size="11" font-weight="bold" font-family="system-ui">EXPOSED DECK</text>

  <!-- Curled Shingles -->
  <polygon points="210,290 270,280 260,320 200,315" fill="#71717a" stroke="#ef4444" stroke-width="2"/>
  <polygon points="500,280 560,270 570,310 510,315" fill="#71717a" stroke="#ef4444" stroke-width="2"/>

  <!-- Damaged Chimney Flashing with Rust Streaks -->
  <polygon points="480,100 550,80 550,180 480,195" fill="#b91c1c"/>
  <path d="M 480,195 Q 520,240 540,280" fill="none" stroke="#ea580c" stroke-width="5" opacity="0.8"/>

  <!-- Warning Label -->
  <rect x="30" y="30" width="280" height="50" rx="8" fill="#991b1b" opacity="0.9"/>
  <text x="50" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="18">⚠️ BEFORE: STORM DAMAGE</text>
  <rect x="30" y="90" width="310" height="30" rx="6" fill="#0f172a" opacity="0.8"/>
  <text x="40" y="110" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">Blown-off shingles, leaks &amp; decayed underlayment</text>
</svg>
