<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="700" height="480" rx="20" fill="url(#aboutGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Blueprint Architectural Grid Lines in Background -->
  <line x1="50" y1="80" x2="650" y2="80" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="50" y1="180" x2="650" y2="180" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="50" y1="280" x2="650" y2="280" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="50" y1="380" x2="650" y2="380" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Large Central Watertight Crest -->
  <g transform="translate(350, 160)">
    <circle cx="0" cy="0" r="90" fill="#0f172a" stroke="#ea580c" stroke-width="4"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Roof + Shield -->
    <path d="M -45,10 L 0,-35 L 45,10" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M -30,5 L -30,35 A 3 3 0 0 0 -27,38 L 27,38 A 3 3 0 0 0 30,35 L 30,5" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <path d="M 0,-5 C 8,5 12,12 12,18 C 12,24.6 6.6,30 0,30 C -6.6,30 -12,24.6 -12,18 C -12,12 -8,5 0,-5 Z" fill="url(#shieldOrange)"/>
  </g>

  <!-- 3 Engineering Pillars Cards Below -->
  <!-- Card 1 -->
  <g transform="translate(60, 310)">
    <rect x="0" y="0" width="170" height="130" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#ea580c"/>
    <text x="35" y="40" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui" text-anchor="middle">15+</text>
    <text x="18" y="75" fill="#ffffff" font-size="13" font-weight="800" font-family="system-ui">Years Proven</text>
    <text x="18" y="95" fill="#94a3b8" font-size="10" font-family="system-ui">Continuous field</text>
    <text x="18" y="110" fill="#94a3b8" font-size="10" font-family="system-ui">master craftsmanship</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(265, 310)">
    <rect x="0" y="0" width="170" height="130" rx="10" fill="#0f172a" stroke="#ea580c" stroke-width="2"/>
    <circle cx="35" cy="35" r="16" fill="#0284c7"/>
    <text x="35" y="40" fill="#ffffff" font-size="12" font-weight="bold" font-family="system-ui" text-anchor="middle">100%</text>
    <text x="18" y="75" fill="#ffffff" font-size="13" font-weight="800" font-family="system-ui">Leak-Proof</text>
    <text x="18" y="95" fill="#94a3b8" font-size="10" font-family="system-ui">Backed by legal</text>
    <text x="18" y="110" fill="#94a3b8" font-size="10" font-family="system-ui">25-year warranty</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(470, 310)">
    <rect x="0" y="0" width="170" height="130" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="35" r="16" fill="#10b981"/>
    <text x="35" y="40" fill="#ffffff" font-size="13" font-weight="bold" font-family="system-ui" text-anchor="middle">0</text>
    <text x="18" y="75" fill="#ffffff" font-size="13" font-weight="800" font-family="system-ui">Zero Callbacks</text>
    <text x="18" y="95" fill="#94a3b8" font-size="10" font-family="system-ui">48-hour flood test</text>
    <text x="18" y="110" fill="#94a3b8" font-size="10" font-family="system-ui">mandatory sign-off</text>
  </g>

  <!-- Header Banner Text -->
  <text x="350" y="55" fill="#ea580c" font-size="13" font-weight="900" font-family="system-ui" letter-spacing="2px" text-anchor="middle">VANGUARD ENGINEERING DIVISION</text>
</svg>
