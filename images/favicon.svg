<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="url(#favGrad)"/>
  
  <!-- Roof Pitch Architecture -->
  <path d="M 12,32 L 32,14 L 52,32" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Chimney Detail -->
  <path d="M 40,21 L 40,16 L 45,16 L 45,25.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Building Walls -->
  <path d="M 19,30 L 19,48 C 19,49.5 20,50.5 21.5,50.5 L 42.5,50.5 C 44,50.5 45,49.5 45,48 L 45,30" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Watertight Droplet Shield Emblemed in Center -->
  <path d="M 32,24 C 37,30 40,34 40,38 C 40,42.4 36.4,46 32,46 C 27.6,46 24,42.4 24,38 C 24,34 27,30 32,24 Z" fill="#ffffff"/>
  <ellipse cx="30" cy="36" rx="2" ry="4" fill="#ea580c" opacity="0.6"/>
</svg>
