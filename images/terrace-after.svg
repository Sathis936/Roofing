<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyAfter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="terraceAfter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="parapetAfter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="sealOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <!-- Bright Clear Sky -->
  <rect width="800" height="500" fill="url(#skyAfter)"/>
  
  <!-- Sunshine glow -->
  <circle cx="700" cy="80" r="120" fill="#fef08a" opacity="0.4"/>
  <circle cx="700" cy="80" r="60" fill="#fde047" opacity="0.6"/>

  <!-- Finished Parapet Wall with Waterproof Coating -->
  <polygon points="0,120 800,120 800,240 0,240" fill="url(#parapetAfter)"/>
  
  <!-- High-Performance Coving / Fillet Waterproof Seal Line -->
  <line x1="0" y1="240" x2="800" y2="240" stroke="url(#sealOrange)" stroke-width="6"/>

  <!-- Flawless Seamless Polyurethane Waterproofing Deck -->
  <polygon points="0,240 800,240 800,500 0,500" fill="url(#terraceAfter)"/>

  <!-- Architectural Slope / Drainage Grid Lines -->
  <line x1="100" y1="240" x2="50" y2="500" stroke="#f8fafc" stroke-width="2" opacity="0.6"/>
  <line x1="300" y1="240" x2="250" y2="500" stroke="#f8fafc" stroke-width="2" opacity="0.6"/>
  <line x1="500" y1="240" x2="500" y2="500" stroke="#f8fafc" stroke-width="2" opacity="0.6"/>
  <line x1="700" y1="240" x2="720" y2="500" stroke="#f8fafc" stroke-width="2" opacity="0.6"/>

  <!-- Stainless Steel Waterproof Drainage Hub -->
  <ellipse cx="650" cy="400" rx="35" ry="18" fill="#334155"/>
  <ellipse cx="650" cy="400" rx="28" ry="14" fill="#64748b"/>
  <ellipse cx="650" cy="400" rx="16" ry="8" fill="#0f172a"/>
  <!-- Drainage Grill Lines -->
  <line x1="638" y1="395" x2="662" y2="405" stroke="#94a3b8" stroke-width="2"/>
  <line x1="638" y1="405" x2="662" y2="395" stroke="#94a3b8" stroke-width="2"/>

  <!-- Hydrophobic Water Droplet Bead Demonstrating 100% Repellency -->
  <g transform="translate(320, 360)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" opacity="0.9"/>
    <ellipse cx="-4" cy="-4" rx="5" ry="3" fill="#ffffff" opacity="0.8"/>
  </g>
  <g transform="translate(380, 390)">
    <circle cx="0" cy="0" r="22" fill="#38bdf8" opacity="0.9"/>
    <ellipse cx="-6" cy="-6" rx="7" ry="4" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Success Annotation Overlay -->
  <rect x="30" y="30" width="310" height="50" rx="8" fill="#15803d" opacity="0.95"/>
  <text x="50" y="62" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="18">✓ AFTER: 5-LAYER PU MEMBRANE</text>
  <rect x="30" y="90" width="310" height="30" rx="6" fill="#0f172a" opacity="0.8"/>
  <text x="40" y="110" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="13">25-Year Guarantee • Zero Water Absorption</text>
</svg>
