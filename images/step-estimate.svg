<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="estBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sheetWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="350" fill="url(#estBg)"/>

  <!-- Blueprint Lines in Background -->
  <line x1="0" y1="50" x2="600" y2="50" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="0" y1="120" x2="600" y2="120" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="0" y1="190" x2="600" y2="190" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="0" y1="260" x2="600" y2="260" stroke="#334155" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Estimate Document Clipboard -->
  <rect x="170" y="30" width="260" height="280" rx="10" fill="#334155" stroke="#475569" stroke-width="2"/>
  <rect x="250" y="15" width="100" height="25" rx="6" fill="#ea580c"/>
  <circle cx="300" cy="27" r="5" fill="#ffffff"/>

  <!-- Document Paper Sheet -->
  <rect x="185" y="45" width="230" height="250" rx="6" fill="url(#sheetWhite)"/>

  <!-- Document Header & Text Rows -->
  <rect x="205" y="65" width="90" height="12" rx="3" fill="#0f172a"/>
  <line x1="205" y1="95" x2="395" y2="95" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="205" y1="115" x2="360" y2="115" stroke="#94a3b8" stroke-width="3"/>
  <line x1="205" y1="135" x2="380" y2="135" stroke="#94a3b8" stroke-width="3"/>
  <line x1="205" y1="155" x2="320" y2="155" stroke="#94a3b8" stroke-width="3"/>

  <!-- Rupee Cost Breakdown Line -->
  <rect x="205" y="180" width="190" height="35" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="215" y="202" fill="#ea580c" font-size="14" font-weight="bold" font-family="system-ui">TOTAL: ₹ LOCKED</text>

  <!-- Certified Approval Stamp -->
  <g transform="translate(330, 240) rotate(-12)">
    <rect x="-55" y="-18" width="110" height="36" rx="4" fill="none" stroke="#10b981" stroke-width="2.5"/>
    <text x="0" y="5" fill="#10b981" font-size="12" font-weight="900" font-family="system-ui" text-anchor="middle">APPROVED</text>
  </g>

  <!-- Architect Pencil -->
  <polygon points="120,240 135,225 190,280 175,295" fill="#f59e0b"/>
  <polygon points="120,240 110,250 135,225" fill="#0f172a"/>
  <polygon points="190,280 200,290 185,305 175,295" fill="#ef4444"/>
</svg>
